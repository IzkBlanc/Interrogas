<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interrogas</title>
    <link rel="icon" type="image/x-icon" href="imgs/Dea/dea_Icon.ico">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <!-- Pagína inicial -->
    <div class="home-container" id="homePage">
        <div class="home-content">
            <h1 class="title">Interrogas</h1>
            <button class="start-btn" id="startBtn">COMEÇAR!</button>
        </div>
        <img class="dea-img" src="imgs/Dea/Dea_home.png" alt="Dea na tela inicial" loading="lazy">
    </div>

    <!-- Página do game -->
    <div class="game-container" id="gamePage" style="display: none;">
        <img class="champ-bg" id="champBg" src="" alt="" loading="lazy">
        <h2 class="question">Qual é o tempo de recarga desta habilidade?</h2>
        <div class="ability-icon">?</div>
        <input type="number" class="answer-input" id="answerInput" placeholder="Digite em segundos...">
        <button class="submit-btn" id="submitBtn">Enviar</button>

        <div class="result-container" id="resultContainer">
            <img class="result-image" id="resultImage" src="" alt="" loading="lazy">
            <p class="result-message" id="resultMessage"></p>
        </div>
    </div>

    <script src="Script.js"></script>
</body>
</html>
